name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Confirms the committed wrapper JAR is an authentic Gradle release
      # artifact (checked against Gradle's published checksums).
      - name: Validate Gradle wrapper authenticity
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Seed local.properties
        run: |
          cp local.properties.example local.properties
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder-key' }}"
            echo "REVENUECAT_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY || 'placeholder-key' }}"
            echo "TELEMETRYDECK_APP_ID=${{ secrets.TELEMETRYDECK_APP_ID || '' }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '' }}"
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN_ANDROID || '' }}"
          } > local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # The wrapper JAR is a committed binary. Verify it against the recorded
      # checksum so a corrupted or tampered wrapper fails loudly instead of
      # silently executing arbitrary code during the build.
      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar \
            || { echo "::error::gradle-wrapper.jar is missing — ./gradlew cannot run"; exit 1; }
          (cd gradle/wrapper && sha256sum -c gradle-wrapper.jar.sha256)
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Check for hardcoded strings
        run: ./check-hardcoded-strings.sh

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # assembleDebug re-exports Room's schema JSON. If the committed copy no
      # longer matches the entities, the working tree goes dirty here — that is
      # a schema change that was never exported, which is exactly the mistake
      # that ships an unmigratable database.
      #
      # Bootstrap: while app/schemas/ is still empty this only warns, so the very
      # first green Android build can produce the baseline JSON to commit.
      - name: Check Room schema is committed and current
        run: |
          if [ -z "$(git ls-files 'app/schemas/**/*.json')" ]; then
            echo "::warning::No Room schema committed yet. Download the 'room-schemas'"
            echo "::warning::artifact from this run and commit app/schemas/ to enable this gate."
            exit 0
          fi
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::Room schema is stale. Run './gradlew assembleDebug' and commit app/schemas/."
            exit 1
          fi
          echo "Room schema is up to date."

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
