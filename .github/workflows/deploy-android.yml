name: Deploy Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0). Leave empty for auto-increment.'
        required: false
        type: string
      version_code:
        description: 'versionCode override. Leave empty to use the run number.'
        required: false
        type: string
      track:
        description: 'Play Console track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.pearsonmedia.lastlogged

jobs:
  build-and-deploy:
    name: Build & Deploy to ${{ github.event.inputs.track || 'internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version calculation

      - name: Validate Gradle wrapper authenticity
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Mirrors the iOS version calculation so both stores stay in step.
      - name: Calculate Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Source: manual override"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Source: git tag"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="1.0.0"
              echo "Source: default (no tags found)"
            else
              LATEST="${LATEST_TAG#v}"
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
              echo "Source: auto-increment from $LATEST_TAG"
            fi
          fi

          # versionCode must increase monotonically for every Play upload.
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            CODE="${{ github.event.inputs.version_code }}"
          else
            CODE="${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "### Version: $VERSION ($CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Seed local.properties
        run: |
          cp local.properties.example local.properties
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "REVENUECAT_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }}"
            echo "TELEMETRYDECK_APP_ID=${{ secrets.TELEMETRYDECK_APP_ID }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN_ANDROID }}"
          } > local.properties

      # Enables FCM. build.gradle.kts applies the Google Services plugin only
      # when this file exists, so an absent secret still produces a valid build.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set — the build will have no FCM support"
          fi

      # The `secrets` context is not available in a step's `if:`, so presence
      # checks have to be turned into step outputs here.
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "has_play_account=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_account=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building an UNSIGNED artifact only"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/lastlogged-release.jks
          {
            echo "storeFile=app/lastlogged-release.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build release AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # R8 obfuscates release builds; without this file no crash report from
      # production can be read.
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload to Play Console
        if: steps.keystore.outputs.signed == 'true' && steps.keystore.outputs.has_play_account == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pearsonmedia.lastlogged
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Explain skipped upload
        if: steps.keystore.outputs.signed != 'true' || steps.keystore.outputs.has_play_account != 'true'
        run: |
          echo "### Play upload skipped" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            echo "- No release keystore (\`ANDROID_KEYSTORE_BASE64\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.keystore.outputs.has_play_account }}" != "true" ]; then
            echo "- No Play service account (\`PLAY_SERVICE_ACCOUNT_JSON\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The AAB is still attached to this run as the \`app-release-aab\` artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -f app/lastlogged-release.jks keystore.properties local.properties app/google-services.json

      - name: Summary
        run: |
          echo "### Android Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.version.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| versionCode | ${{ steps.version.outputs.code }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Track | ${{ github.event.inputs.track || 'internal' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signed | ${{ steps.keystore.outputs.signed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | ${{ env.PACKAGE_NAME }} |" >> "$GITHUB_STEP_SUMMARY"
