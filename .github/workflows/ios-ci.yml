name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'LastLogged/**'
      - 'LastLoggedWidget/**'
      - 'LastLogged.xcodeproj/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'LastLogged/**'
      - 'LastLoggedWidget/**'
      - 'LastLogged.xcodeproj/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: LastLogged
  PROJECT: LastLogged.xcodeproj
  DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'

jobs:
  build:
    name: Build & Test (no signing)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('LastLogged.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Seed Secrets.xcconfig
        run: |
          # CI uses the committed example so builds compile; AppSecrets.validate()
          # will warn but not crash in DEBUG. Release builds go through the
          # deploy-ios workflow with real secrets.
          cp LastLogged/Config/Secrets.example.xcconfig LastLogged/Config/Secrets.xcconfig

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      # build-for-testing compiles both the app and LastLoggedTests, so a
      # separate build step would just duplicate the work.
      - name: Build & Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/LastLogged.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions || exit $?

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/LastLogged.xcresult
          if-no-files-found: ignore
