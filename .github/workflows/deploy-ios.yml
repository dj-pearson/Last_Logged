name: Deploy iOS App

# Archive, export and TestFlight upload run in the shared Pearson Media iOS
# release workflow (Pearson-Media/ios-release). This file only says what is
# particular to Last Logged. Signing is automatic, so the app and its widget
# each get the right profile without any profile secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0). Leave empty to keep the project value.'
        required: false
        type: string
      build_number:
        description: 'Build number override. Leave empty to use the run number.'
        required: false
        type: string
      upload:
        description: 'Upload to TestFlight (off = build and sign only)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    uses: Pearson-Media/ios-release/.github/workflows/ios-release.yml@v1
    with:
      working-directory: .
      project: LastLogged.xcodeproj
      scheme: LastLogged
      marketing-version: ${{ inputs.version }}
      build-number: ${{ inputs.build_number }}
      require-tag-on-branch: ""
      upload: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
      required-env: SUPABASE_URL SUPABASE_ANON_KEY REVENUECAT_API_KEY
      # Without Secrets.xcconfig the archive falls through to
      # Secrets.example.xcconfig and AppSecrets.validate() fatalErrors on first
      # launch. xcconfig reads '//' as a comment even inside a value, so URLs
      # are escaped.
      prepare-command: |
        set -euo pipefail
        escape_url() { printf '%s' "$1" | sed 's|//|$()//|g'; }
        {
          echo "SUPABASE_URL = $(escape_url "$SUPABASE_URL")"
          echo "SUPABASE_ANON_KEY = ${SUPABASE_ANON_KEY}"
          echo "REVENUECAT_API_KEY = ${REVENUECAT_API_KEY}"
          echo "TELEMETRYDECK_APP_ID = ${TELEMETRYDECK_APP_ID:-}"
          echo "SENTRY_DSN = $(escape_url "${SENTRY_DSN:-}")"
        } > LastLogged/Config/Secrets.xcconfig
        sed 's/=.*/= ***/' LastLogged/Config/Secrets.xcconfig
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      BUILD_ENV: |
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        REVENUECAT_API_KEY=${{ secrets.REVENUECAT_IOS_API_KEY }}
        TELEMETRYDECK_APP_ID=${{ secrets.TELEMETRYDECK_APP_ID }}
        SENTRY_DSN=${{ secrets.SENTRY_DSN_IOS }}
