name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck
        working-directory: website
        run: npx astro check

      - name: Build
        working-directory: website
        env:
          # Generate valid /.well-known association files. REQUIRE_APP_LINKS
          # makes a placeholder value fail the deploy instead of silently
          # shipping association files both platforms reject.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_SHA256_CERT: ${{ secrets.ANDROID_SHA256_CERT }}
          REQUIRE_APP_LINKS: 'true'
        run: npm run build

      - name: Verify app association files
        working-directory: website
        run: |
          for f in dist/.well-known/apple-app-site-association dist/.well-known/assetlinks.json; do
            test -f "$f" || { echo "::error::$f was not generated"; exit 1; }
            if grep -qE 'TEAMID|REPLACE_WITH_YOUR_SHA256_FINGERPRINT' "$f"; then
              echo "::error::$f still contains placeholder values"; exit 1
            fi
          done
          echo "Association files look valid."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lastlogged-website
          workingDirectory: website

      - name: Summary
        run: |
          echo "### Website Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "lastlogged.com updated via Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
